name: CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: employee_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/employee_db
        run: pytest tests/ -v

  build-and-push:
    # Build independently so test failures do not hide build results.
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare image name
        id: image
        shell: bash
        run: |
          REPOSITORY=$(printf '%s' "$GITHUB_REPOSITORY" | tr '[:upper:]' '[:lower:]')
          echo "name=ghcr.io/${REPOSITORY}/employee-api" >> "$GITHUB_OUTPUT"

      # QEMU lets the amd64 GitHub runner build the arm64 variant that
      # minikube on Apple Silicon needs.
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build image and publish on main
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          cache-from: type=gha
          cache-to: type=gha,mode=max
          push: ${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' }}
          tags: |
            ${{ steps.image.outputs.name }}:${{ github.sha }}
            ${{ steps.image.outputs.name }}:latest

  deploy-staging:
    # Deployment requires both tests and image publication to succeed.
    needs: [test, build-and-push]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    # Runs on the Mac that hosts minikube/vCluster (the cluster is only
    # reachable from that machine via 127.0.0.1:8443 port-forward).
    runs-on: [self-hosted, macOS, ARM64]
    environment: staging

    concurrency:
      group: employee-api-staging
      cancel-in-progress: false

    permissions:
      contents: read
      packages: read

    # NOTE: the `runner` context is NOT available at job-level env,
    # so KUBECONFIG is exported from a step instead.
    env:
      HELM_CHART: oci://ghcr.io/ccdennar/helm-charts/employee-api
      HELM_CHART_VERSION: ${{ vars.HELM_CHART_VERSION }}
      IMAGE_TAG: ${{ github.sha }}
      RELEASE_NAME: employee-api
      DEPLOY_NAMESPACE: staging
      # Override with repo/environment variables if your chart names differ.
      DEPLOYMENT_NAME: ${{ vars.DEPLOYMENT_NAME || 'employee-api' }}
      SERVICE_NAME: ${{ vars.SERVICE_NAME || 'employee-api' }}

    steps:
      - name: Set kubeconfig path and tool PATH
        shell: bash
        run: |
          echo "KUBECONFIG=${RUNNER_TEMP}/vcluster-kubeconfig" >> "$GITHUB_ENV"
          # Homebrew locations (Apple Silicon and Intel) for jq, curl, etc.
          echo "/opt/homebrew/bin" >> "$GITHUB_PATH"
          echo "/usr/local/bin" >> "$GITHUB_PATH"

      - name: Install kubectl
        uses: azure/setup-kubectl@v4

      - name: Install Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.17.3

      - name: Check required tools
        shell: bash
        run: |
          set -euo pipefail
          for tool in jq curl kubectl helm; do
            command -v "$tool" >/dev/null 2>&1 || {
              echo "Missing required tool: $tool (on macOS: brew install $tool)"
              exit 1
            }
          done

      - name: Validate deployment settings
        shell: bash
        run: |
          set -euo pipefail
          : "${HELM_CHART_VERSION:?Set staging variable HELM_CHART_VERSION}"

      - name: Configure vCluster access
        shell: bash
        env:
          VCLUSTER_KUBECONFIG_BASE64: ${{ secrets.VCLUSTER_KUBECONFIG_BASE64 }}
        run: |
          set -euo pipefail
          umask 077

          : "${VCLUSTER_KUBECONFIG_BASE64:?Set staging secret VCLUSTER_KUBECONFIG_BASE64}"

          printf '%s' "$VCLUSTER_KUBECONFIG_BASE64" \
            | base64 --decode > "$KUBECONFIG"

          # Reject kubeconfigs that point at local credential files.
          LOCAL_REFS=$(
            kubectl config view --minify -o json | jq -r '
              [
                (.clusters[]?.cluster | select(has("certificate-authority")) | "certificate-authority"),
                (.users[]?.user | select(has("client-certificate")) | "client-certificate"),
                (.users[]?.user | select(has("client-key")) | "client-key"),
                (.users[]?.user | select(has("tokenFile")) | "tokenFile")
              ] | join(", ")
            '
          )

          if [ -n "$LOCAL_REFS" ]; then
            echo "Kubeconfig references local credential files: $LOCAL_REFS"
            echo "Supply a self-contained vCluster kubeconfig."
            exit 1
          fi

          kubectl cluster-info --request-timeout=10s

      - name: Log in to Helm registry
        shell: bash
        env:
          GHCR_USERNAME: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          printf '%s' "$GHCR_TOKEN" \
            | helm registry login ghcr.io \
                --username "$GHCR_USERNAME" \
                --password-stdin

      - name: Record previous release revision
        id: previous
        shell: bash
        run: |
          set -euo pipefail

          REVISION=$(
            helm list \
              --namespace "$DEPLOY_NAMESPACE" \
              --all \
              --filter "^${RELEASE_NAME}$" \
              --output json \
            | jq -r '.[0].revision // empty'
          )

          printf 'revision=%s\n' "$REVISION" >> "$GITHUB_OUTPUT"

      - name: Deploy to vCluster
        id: deploy
        shell: bash
        env:
          PREVIOUS_REVISION: ${{ steps.previous.outputs.revision }}
        run: |
          set -euo pipefail

          # Portable lowercase (macOS bash 3.2 has no ${VAR,,}).
          REPOSITORY=$(printf '%s' "$GITHUB_REPOSITORY" | tr '[:upper:]' '[:lower:]')

          # No --atomic here: atomic deletes the failed pods before anyone can
          # see why they failed. Instead, deploy, and on failure print
          # diagnostics first, then restore the previous state ourselves.
          set +e
          helm upgrade --install "$RELEASE_NAME" "$HELM_CHART" \
            --version "$HELM_CHART_VERSION" \
            --namespace "$DEPLOY_NAMESPACE" \
            --create-namespace \
            --set-string image.repository="ghcr.io/${REPOSITORY}/employee-api" \
            --set-string image.tag="$IMAGE_TAG" \
            --wait \
            --timeout 300s
          HELM_EXIT=$?
          set -e

          if [ "$HELM_EXIT" -ne 0 ]; then
            echo "::group::Deployment diagnostics"

            echo "--- pods ---"
            kubectl get pods --namespace "$DEPLOY_NAMESPACE" -o wide || true

            echo "--- describe pods ---"
            kubectl describe pods --namespace "$DEPLOY_NAMESPACE" || true

            echo "--- events ---"
            kubectl get events --namespace "$DEPLOY_NAMESPACE" \
              --sort-by=.lastTimestamp || true

            echo "--- container logs ---"
            for POD in $(kubectl get pods --namespace "$DEPLOY_NAMESPACE" -o name); do
              echo ">>> $POD (current)"
              kubectl logs "$POD" --namespace "$DEPLOY_NAMESPACE" \
                --all-containers --tail=100 || true
              echo ">>> $POD (previous)"
              kubectl logs "$POD" --namespace "$DEPLOY_NAMESPACE" \
                --all-containers --previous --tail=100 2>/dev/null || true
            done

            echo "::endgroup::"

            echo "Deployment failed. Restoring previous state."
            if [ -n "$PREVIOUS_REVISION" ]; then
              helm rollback "$RELEASE_NAME" "$PREVIOUS_REVISION" \
                --namespace "$DEPLOY_NAMESPACE" \
                --wait \
                --timeout 300s || true
            else
              helm uninstall "$RELEASE_NAME" \
                --namespace "$DEPLOY_NAMESPACE" || true
            fi

            exit "$HELM_EXIT"
          fi

      - name: Validate pod environment before smoke tests
        shell: bash
        run: |
          set -euo pipefail
          
          # Check that DATABASE_URL is actually set in running pods
          DB_URL=$(kubectl get pod -n "$DEPLOY_NAMESPACE" \
            -l app.kubernetes.io/instance="$RELEASE_NAME" \
            -o jsonpath='{.items[0].spec.containers[0].env[?(@.name=="DATABASE_URL")].value}')
          
          if [ -z "$DB_URL" ]; then
            echo "❌ FATAL: DATABASE_URL not found in pod environment"
            kubectl describe pod -n "$DEPLOY_NAMESPACE" \
              -l app.kubernetes.io/instance="$RELEASE_NAME" | grep -A 20 "Environment:"
            exit 1
          fi
          
          echo "✅ DATABASE_URL configured: $(echo "$DB_URL" | sed 's/:\/\/[^:]*:[^@]*@/:\/\/***:***@/')"

      - name: Smoke tests
        id: smoke
        shell: bash
        run: |
          set -euo pipefail

          LOCAL_PORT=18080
          BASE_URL="http://127.0.0.1:${LOCAL_PORT}"
          PF_PID=""
          EMP_ID=""

          kubectl rollout status "deployment/${DEPLOYMENT_NAME}" \
            --namespace "$DEPLOY_NAMESPACE" \
            --timeout=300s

          # Discover the Service port instead of hard-coding it.
          SERVICE_PORT=$(
            kubectl get svc "$SERVICE_NAME" \
              --namespace "$DEPLOY_NAMESPACE" \
              -o jsonpath='{.spec.ports[0].port}'
          )
          echo "Port-forwarding svc/${SERVICE_NAME}:${SERVICE_PORT} -> 127.0.0.1:${LOCAL_PORT}"

          cleanup() {
            if [ -n "$EMP_ID" ]; then
              curl --silent --show-error \
                --connect-timeout 10 --max-time 30 \
                --request DELETE \
                "$BASE_URL/api/v1/employees/$EMP_ID" \
                --output /dev/null || true
            fi
            if [ -n "$PF_PID" ]; then
              kill "$PF_PID" 2>/dev/null || true
            fi
          }
          trap cleanup EXIT

          kubectl port-forward \
            --namespace "$DEPLOY_NAMESPACE" \
            "svc/${SERVICE_NAME}" "${LOCAL_PORT}:${SERVICE_PORT}" \
            > "${RUNNER_TEMP}/smoke-port-forward.log" 2>&1 &
          PF_PID=$!

          # Wait for the health endpoint to answer 200.
          STATUS="000"
          for _ in $(seq 1 30); do
            STATUS=$(
              curl --silent \
                --connect-timeout 2 --max-time 5 \
                --output /dev/null --write-out '%{http_code}' \
                "$BASE_URL/health/live" || true
            )
            [ "$STATUS" = "200" ] && break
            sleep 2
          done

          if [ "$STATUS" != "200" ]; then
            echo "Health check failed: HTTP $STATUS"
            echo "--- port-forward log ---"
            cat "${RUNNER_TEMP}/smoke-port-forward.log" || true
            exit 1
          fi

          EMAIL="smoke-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}@example.com"

          PAYLOAD=$(
            jq -n --arg email "$EMAIL" '{
              first_name: "Smoke",
              last_name: "Test",
              email: $email,
              department: "QA",
              job_title: "Tester",
              salary: 1,
              employment_status: "ACTIVE"
            }'
          )

          CREATE=$(
            curl --fail-with-body --silent --show-error \
              --connect-timeout 10 --max-time 30 \
              --request POST "$BASE_URL/api/v1/employees" \
              --header "Content-Type: application/json" \
              --data "$PAYLOAD"
          )

          EMP_ID=$(
            printf '%s' "$CREATE" \
              | jq -er '.id | select(. != null and . != "") | tostring | @uri'
          )

          GET=$(
            curl --fail-with-body --silent --show-error \
              --connect-timeout 10 --max-time 30 \
              "$BASE_URL/api/v1/employees/$EMP_ID"
          )

          NAME=$(printf '%s' "$GET" | jq -er '.first_name')

          if [ "$NAME" != "Smoke" ]; then
            echo "Expected Smoke, got $NAME"
            exit 1
          fi

          # Explicit cleanup on success; the EXIT trap handles failures.
          curl --fail-with-body --silent --show-error \
            --connect-timeout 10 --max-time 30 \
            --request DELETE \
            "$BASE_URL/api/v1/employees/$EMP_ID" \
            --output /dev/null
          EMP_ID=""

          echo "Smoke tests passed"

      - name: Roll back after failed smoke tests
        if: ${{ failure() && steps.deploy.outcome == 'success' && steps.smoke.outcome == 'failure' }}
        shell: bash
        env:
          PREVIOUS_REVISION: ${{ steps.previous.outputs.revision }}
        run: |
          set -euo pipefail

          if [ -z "$PREVIOUS_REVISION" ]; then
            echo "First installation: no previous revision to restore."
            exit 1
          fi

          helm rollback "$RELEASE_NAME" "$PREVIOUS_REVISION" \
            --namespace "$DEPLOY_NAMESPACE" \
            --wait \
            --timeout 300s

      - name: Remove kubeconfig
        if: always()
        shell: bash
        run: |
          if [ -n "${KUBECONFIG:-}" ]; then
            rm -f "$KUBECONFIG"
          fi