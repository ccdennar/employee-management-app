name: CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: employee_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/employee_db
        run: pytest tests/ -v

  build-and-push:
    # Build independently so test failures do not hide build results.
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare image name
        id: image
        shell: bash
        run: |
          REPOSITORY=$(printf '%s' "$GITHUB_REPOSITORY" | tr '[:upper:]' '[:lower:]')
          echo "name=ghcr.io/${REPOSITORY}/employee-api" >> "$GITHUB_OUTPUT"

      # QEMU lets the amd64 GitHub runner build the arm64 variant that
      # minikube on Apple Silicon needs.
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build image and publish on main
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          cache-from: type=gha
          cache-to: type=gha,mode=max
          push: ${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' }}
          tags: |
            ${{ steps.image.outputs.name }}:${{ github.sha }}
            ${{ steps.image.outputs.name }}:latest

  deploy-staging:
    # Deployment requires both tests and image publication to succeed.
    needs: [test, build-and-push]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    # Runs on the Mac that hosts minikube/vCluster (the cluster is only
    # reachable from that machine via a 127.0.0.1:8443 port-forward).
    runs-on: [self-hosted, macOS, ARM64]
    environment: staging

    concurrency:
      group: employee-api-staging
      cancel-in-progress: false

    permissions:
      contents: read
      packages: read

    # NOTE: the `runner` context is NOT available at job-level env,
    # so KUBECONFIG is exported from a step instead.
    env:
      HELM_CHART: oci://ghcr.io/ccdennar/helm-charts/employee-api
      HELM_CHART_VERSION: ${{ vars.HELM_CHART_VERSION }}
      IMAGE_TAG: ${{ github.sha }}
      RELEASE_NAME: employee-api
      DEPLOY_NAMESPACE: staging
      # Override with repo/environment variables if your chart names differ.
      DEPLOYMENT_NAME: ${{ vars.DEPLOYMENT_NAME || 'employee-api' }}
      SERVICE_NAME: ${{ vars.SERVICE_NAME || 'employee-api' }}

    steps:
      - name: Set kubeconfig path and tool PATH
        shell: bash
        run: |
          echo "KUBECONFIG=${RUNNER_TEMP}/vcluster-kubeconfig" >> "$GITHUB_ENV"
          # Homebrew locations (Apple Silicon and Intel) for jq, curl, etc.
          echo "/opt/homebrew/bin" >> "$GITHUB_PATH"
          echo "/usr/local/bin" >> "$GITHUB_PATH"

      - name: Install kubectl
        uses: azure/setup-kubectl@v4

      - name: Install Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.17.3

      - name: Check required tools
        shell: bash
        run: |
          set -euo pipefail
          for tool in jq curl kubectl helm; do
            command -v "$tool" >/dev/null 2>&1 || {
              echo "Missing required tool: $tool (on macOS: brew install $tool)"
              exit 1
            }
          done

      - name: Validate deployment settings
        shell: bash
        run: |
          set -euo pipefail
          : "${HELM_CHART_VERSION:?Set staging variable HELM_CHART_VERSION}"

      - name: Ensure host port-forward to the vCluster
        shell: bash
        env:
          # kubectl context of the host cluster in ~/.kube/config on this Mac
          HOST_CONTEXT: ${{ vars.HOST_KUBE_CONTEXT || 'minikube' }}
          # namespace and Service of the vCluster on the host cluster
          VCLUSTER_HOST_NAMESPACE: ${{ vars.VCLUSTER_HOST_NAMESPACE || 'staging' }}
          VCLUSTER_HOST_SERVICE: ${{ vars.VCLUSTER_HOST_SERVICE || 'staging' }}
        run: |
          set -euo pipefail

          # The vCluster kubeconfig points at https://127.0.0.1:8443, so
          # something must forward that port to the vCluster Service.
          # Any HTTP answer (even 401) means the tunnel is up.
          reachable() {
            curl -sk --connect-timeout 2 --max-time 4 \
              --output /dev/null https://127.0.0.1:8443/version
          }

          if reachable; then
            echo "127.0.0.1:8443 is already reachable (existing port-forward); reusing it."
            exit 0
          fi

          echo "Starting port-forward: ${HOST_CONTEXT} ${VCLUSTER_HOST_NAMESPACE}/svc/${VCLUSTER_HOST_SERVICE} -> 127.0.0.1:8443"
          KUBECONFIG="$HOME/.kube/config" nohup kubectl \
            --context "$HOST_CONTEXT" \
            --namespace "$VCLUSTER_HOST_NAMESPACE" \
            port-forward "svc/${VCLUSTER_HOST_SERVICE}" 8443:443 \
            > "${RUNNER_TEMP}/vcluster-host-port-forward.log" 2>&1 &
          echo $! > "${RUNNER_TEMP}/vcluster-host-port-forward.pid"

          for _ in $(seq 1 30); do
            if reachable; then
              echo "Port-forward is ready."
              exit 0
            fi
            sleep 1
          done

          echo "Port-forward did not become ready. Log:"
          cat "${RUNNER_TEMP}/vcluster-host-port-forward.log" || true
          echo "Check that minikube is running and that the vCluster pod is Ready:"
          echo "  minikube status"
          echo "  kubectl --context ${HOST_CONTEXT} -n ${VCLUSTER_HOST_NAMESPACE} get pods"
          exit 1

      - name: Configure vCluster access
        shell: bash
        env:
          VCLUSTER_KUBECONFIG_BASE64: ${{ secrets.VCLUSTER_KUBECONFIG_BASE64 }}
        run: |
          set -euo pipefail
          umask 077

          : "${VCLUSTER_KUBECONFIG_BASE64:?Set staging secret VCLUSTER_KUBECONFIG_BASE64}"

          printf '%s' "$VCLUSTER_KUBECONFIG_BASE64" \
            | base64 --decode > "$KUBECONFIG"

          # Reject kubeconfigs that point at local credential files.
          LOCAL_REFS=$(
            kubectl config view --minify -o json | jq -r '
              [
                (.clusters[]?.cluster | select(has("certificate-authority")) | "certificate-authority"),
                (.users[]?.user | select(has("client-certificate")) | "client-certificate"),
                (.users[]?.user | select(has("client-key")) | "client-key"),
                (.users[]?.user | select(has("tokenFile")) | "tokenFile")
              ] | join(", ")
            '
          )

          if [ -n "$LOCAL_REFS" ]; then
            echo "Kubeconfig references local credential files: $LOCAL_REFS"
            echo "Supply a self-contained vCluster kubeconfig."
            exit 1
          fi

          kubectl cluster-info --request-timeout=10s

      - name: Log in to Helm registry
        shell: bash
        env:
          GHCR_USERNAME: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          printf '%s' "$GHCR_TOKEN" \
            | helm registry login ghcr.io \
                --username "$GHCR_USERNAME" \
                --password-stdin

      - name: Show the chart that will be deployed
        shell: bash
        run: |
          set -euo pipefail
          # Fails early (with a clear message) if this chart version was never published.
          helm show chart "$HELM_CHART" --version "$HELM_CHART_VERSION" \
            | grep -E '^(name|version|appVersion):'

      - name: Record previous release revision
        id: previous
        shell: bash
        run: |
          set -euo pipefail

          # Only a revision that is actually "deployed" counts as a safe
          # rollback target; a failed release must not be restored.
          REVISION=$(
            helm list \
              --namespace "$DEPLOY_NAMESPACE" \
              --all \
              --filter "^${RELEASE_NAME}$" \
              --output json \
            | jq -r '.[0] | select(.status == "deployed") | .revision // empty'
          )

          printf 'revision=%s\n' "$REVISION" >> "$GITHUB_OUTPUT"

      - name: Deploy to vCluster
        id: deploy
        shell: bash
        env:
          PREVIOUS_REVISION: ${{ steps.previous.outputs.revision }}
        run: |
          set -euo pipefail

          # Portable lowercase (macOS bash 3.2 has no ${VAR,,}).
          REPOSITORY=$(printf '%s' "$GITHUB_REPOSITORY" | tr '[:upper:]' '[:lower:]')

          # No --atomic here: atomic deletes the failed pods before anyone can
          # see why they failed. Instead, deploy, and on failure print
          # diagnostics first, then restore the previous state ourselves.
          set +e
          helm upgrade --install "$RELEASE_NAME" "$HELM_CHART" \
            --version "$HELM_CHART_VERSION" \
            --namespace "$DEPLOY_NAMESPACE" \
            --create-namespace \
            --set-string image.repository="ghcr.io/${REPOSITORY}/employee-api" \
            --set-string image.tag="$IMAGE_TAG" \
            --wait \
            --timeout 300s
          HELM_EXIT=$?
          set -e

          if [ "$HELM_EXIT" -ne 0 ]; then
            echo "::group::Deployment diagnostics"

            echo "--- pods ---"
            kubectl get pods --namespace "$DEPLOY_NAMESPACE" -o wide || true

            echo "--- describe pods ---"
            kubectl describe pods --namespace "$DEPLOY_NAMESPACE" || true

            echo "--- events ---"
            kubectl get events --namespace "$DEPLOY_NAMESPACE" \
              --sort-by=.lastTimestamp || true

            echo "--- container logs ---"
            for POD in $(kubectl get pods --namespace "$DEPLOY_NAMESPACE" -o name); do
              echo ">>> $POD (current)"
              kubectl logs "$POD" --namespace "$DEPLOY_NAMESPACE" \
                --all-containers --tail=100 || true
              echo ">>> $POD (previous)"
              kubectl logs "$POD" --namespace "$DEPLOY_NAMESPACE" \
                --all-containers --previous --tail=100 2>/dev/null || true
            done

            echo "::endgroup::"

            echo "Deployment failed. Restoring previous state."
            if [ -n "$PREVIOUS_REVISION" ]; then
              helm rollback "$RELEASE_NAME" "$PREVIOUS_REVISION" \
                --namespace "$DEPLOY_NAMESPACE" \
                --wait \
                --timeout 300s || true
            else
              helm uninstall "$RELEASE_NAME" \
                --namespace "$DEPLOY_NAMESPACE" || true
            fi

            exit "$HELM_EXIT"
          fi

      - name: Validate pod environment before smoke tests
        shell: bash
        run: |
          set -euo pipefail

          POD_LABEL="app.kubernetes.io/instance=${RELEASE_NAME}"

          # Does the pod define DATABASE_URL at all (plain value or secretKeyRef)?
          ENV_NAME=$(kubectl get pod --namespace "$DEPLOY_NAMESPACE" \
            -l "$POD_LABEL" \
            -o jsonpath='{.items[0].spec.containers[0].env[?(@.name=="DATABASE_URL")].name}')

          if [ -z "$ENV_NAME" ]; then
            echo "FATAL: DATABASE_URL is not set in the pod environment."
            echo "The published chart version ${HELM_CHART_VERSION} does not configure the database."
            kubectl describe pod --namespace "$DEPLOY_NAMESPACE" -l "$POD_LABEL" \
              | grep -A 20 "Environment:" || true
            exit 1
          fi

          DB_URL=$(kubectl get pod --namespace "$DEPLOY_NAMESPACE" \
            -l "$POD_LABEL" \
            -o jsonpath='{.items[0].spec.containers[0].env[?(@.name=="DATABASE_URL")].value}')

          if [ -n "$DB_URL" ]; then
            # Mask credentials in the log.
            echo "DATABASE_URL configured: $(printf '%s' "$DB_URL" | sed 's#://[^:]*:[^@]*@#://***:***@#')"
          else
            echo "DATABASE_URL configured (from a Secret reference)."
          fi

      - name: Smoke tests
        id: smoke
        shell: bash
        run: |
          set -euo pipefail

          LOCAL_PORT=18080
          BASE_URL="http://127.0.0.1:${LOCAL_PORT}"
          PF_PID=""
          EMP_ID=""

          kubectl rollout status "deployment/${DEPLOYMENT_NAME}" \
            --namespace "$DEPLOY_NAMESPACE" \
            --timeout=300s

          # Discover the Service port instead of hard-coding it.
          SERVICE_PORT=$(
            kubectl get svc "$SERVICE_NAME" \
              --namespace "$DEPLOY_NAMESPACE" \
              -o jsonpath='{.spec.ports[0].port}'
          )
          echo "Port-forwarding svc/${SERVICE_NAME}:${SERVICE_PORT} -> 127.0.0.1:${LOCAL_PORT}"

          cleanup() {
            if [ -n "$EMP_ID" ]; then
              curl --silent --show-error \
                --connect-timeout 10 --max-time 30 \
                --request DELETE \
                "$BASE_URL/api/v1/employees/$EMP_ID" \
                --output /dev/null || true
            fi
            if [ -n "$PF_PID" ]; then
              kill "$PF_PID" 2>/dev/null || true
            fi
          }
          trap cleanup EXIT

          start_port_forward() {
            kubectl port-forward \
              --namespace "$DEPLOY_NAMESPACE" \
              "svc/${SERVICE_NAME}" "${LOCAL_PORT}:${SERVICE_PORT}" \
              >> "${RUNNER_TEMP}/smoke-port-forward.log" 2>&1 &
            PF_PID=$!
            sleep 2
          }

          : > "${RUNNER_TEMP}/smoke-port-forward.log"
          start_port_forward

          # Wait for the health endpoint to answer 200.
          # `kubectl port-forward` exits after a single failed connection to the
          # pod ("lost connection to pod"), so restart it whenever it has died.
          STATUS="000"
          for _ in $(seq 1 45); do
            if ! kill -0 "$PF_PID" 2>/dev/null; then
              echo "port-forward exited; restarting it"
              start_port_forward
            fi

            STATUS=$(
              curl --silent \
                --connect-timeout 2 --max-time 5 \
                --output /dev/null --write-out '%{http_code}' \
                "$BASE_URL/health/live" || true
            )
            [ "$STATUS" = "200" ] && break
            sleep 2
          done

          if [ "$STATUS" != "200" ]; then
            echo "Health check failed: HTTP $STATUS"
            echo "--- port-forward log ---"
            cat "${RUNNER_TEMP}/smoke-port-forward.log" || true
            echo "--- pods ---"
            kubectl get pods --namespace "$DEPLOY_NAMESPACE" -o wide || true
            echo "--- app logs (last 50 lines) ---"
            kubectl logs "deployment/${DEPLOYMENT_NAME}" \
              --namespace "$DEPLOY_NAMESPACE" --tail=50 || true
            exit 1
          fi

          EMAIL="smoke-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}@example.com"

          PAYLOAD=$(
            jq -n --arg email "$EMAIL" '{
              first_name: "Smoke",
              last_name: "Test",
              email: $email,
              department: "QA",
              job_title: "Tester",
              salary: 1,
              employment_status: "ACTIVE"
            }'
          )

          CREATE=$(
            curl --fail-with-body --silent --show-error \
              --connect-timeout 10 --max-time 30 \
              --request POST "$BASE_URL/api/v1/employees" \
              --header "Content-Type: application/json" \
              --data "$PAYLOAD"
          )

          EMP_ID=$(
            printf '%s' "$CREATE" \
              | jq -er '.id | select(. != null and . != "") | tostring | @uri'
          )

          GET=$(
            curl --fail-with-body --silent --show-error \
              --connect-timeout 10 --max-time 30 \
              "$BASE_URL/api/v1/employees/$EMP_ID"
          )

          NAME=$(printf '%s' "$GET" | jq -er '.first_name')

          if [ "$NAME" != "Smoke" ]; then
            echo "Expected Smoke, got $NAME"
            exit 1
          fi

          # Explicit cleanup on success; the EXIT trap handles failures.
          curl --fail-with-body --silent --show-error \
            --connect-timeout 10 --max-time 30 \
            --request DELETE \
            "$BASE_URL/api/v1/employees/$EMP_ID" \
            --output /dev/null
          EMP_ID=""

          echo "Smoke tests passed"

      - name: Diagnostics after failed smoke tests
        if: ${{ failure() && steps.deploy.outcome == 'success' && steps.smoke.outcome == 'failure' }}
        shell: bash
        run: |
          set -uo pipefail

          echo "--- pods ---"
          kubectl get pods --namespace "$DEPLOY_NAMESPACE" -o wide || true

          echo "--- restart reasons (last terminated state) ---"
          kubectl get pods --namespace "$DEPLOY_NAMESPACE" -o json \
            | jq -r '.items[] | .metadata.name as $p
                | .status.containerStatuses[]?
                | "\($p) restarts=\(.restartCount) last=\(.lastState.terminated.reason // "none") exit=\(.lastState.terminated.exitCode // "-")"' \
            || true

          echo "--- describe pods ---"
          kubectl describe pods --namespace "$DEPLOY_NAMESPACE" || true

          echo "--- events ---"
          kubectl get events --namespace "$DEPLOY_NAMESPACE" \
            --sort-by=.lastTimestamp || true

          echo "--- container logs ---"
          for POD in $(kubectl get pods --namespace "$DEPLOY_NAMESPACE" -o name); do
            echo ">>> $POD (current)"
            kubectl logs "$POD" --namespace "$DEPLOY_NAMESPACE" \
              --all-containers --tail=100 || true
            echo ">>> $POD (previous)"
            kubectl logs "$POD" --namespace "$DEPLOY_NAMESPACE" \
              --all-containers --previous --tail=100 2>/dev/null || true
          done

      - name: Roll back after failed smoke tests
        if: ${{ failure() && steps.deploy.outcome == 'success' && steps.smoke.outcome == 'failure' }}
        shell: bash
        env:
          PREVIOUS_REVISION: ${{ steps.previous.outputs.revision }}
        run: |
          set -euo pipefail

          if [ -z "$PREVIOUS_REVISION" ]; then
            echo "No previous healthy revision: removing the failed release."
            helm uninstall "$RELEASE_NAME" --namespace "$DEPLOY_NAMESPACE" || true
            exit 1
          fi

          helm rollback "$RELEASE_NAME" "$PREVIOUS_REVISION" \
            --namespace "$DEPLOY_NAMESPACE" \
            --wait \
            --timeout 300s

      - name: Remove kubeconfig and stop host port-forward
        if: always()
        shell: bash
        run: |
          if [ -n "${KUBECONFIG:-}" ]; then
            rm -f "$KUBECONFIG"
          fi

          PID_FILE="${RUNNER_TEMP}/vcluster-host-port-forward.pid"
          if [ -f "$PID_FILE" ]; then
            kill "$(cat "$PID_FILE")" 2>/dev/null || true
            rm -f "$PID_FILE"
          fi